<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#15803d">
    <title>PrixMalin</title>
    <!-- Text size and theme of this device, before the first render -->
    <script src="/static/js/boot.js?v=__VERSION__"></script>
    <link rel="stylesheet" href="/static/css/tokens.css?v=__VERSION__">
    <link rel="stylesheet" href="/static/css/base.css?v=__VERSION__">
    <link rel="stylesheet" href="/static/css/shell.css?v=__VERSION__">
    <link rel="stylesheet" href="/static/css/components.css?v=__VERSION__">
    <link rel="stylesheet" href="/static/css/home.css?v=__VERSION__">
    <link rel="stylesheet" href="/static/css/search.css?v=__VERSION__">
    <link rel="stylesheet" href="/static/css/results.css?v=__VERSION__">
    <link rel="stylesheet" href="/static/css/list.css?v=__VERSION__">
    <link rel="stylesheet" href="/static/css/basket.css?v=__VERSION__">
    <link rel="stylesheet" href="/static/css/shopping.css?v=__VERSION__">
    <link rel="stylesheet" href="/static/css/print.css?v=__VERSION__">
    <link rel="stylesheet" href="/static/css/settings.css?v=__VERSION__">
    <link rel="stylesheet" href="/static/css/stores.css?v=__VERSION__">
    <link rel="stylesheet" href="/static/css/status.css?v=__VERSION__">
    <link rel="stylesheet" href="/static/css/onboarding.css?v=__VERSION__">
    <link rel="stylesheet" href="/static/css/tracking.css?v=__VERSION__">
    <link rel="stylesheet" href="/static/css/product.css?v=__VERSION__">
    <link rel="stylesheet" href="/static/css/system.css?v=__VERSION__">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="#/">Prix<span>Malin</span></a>
        <div class="topbar-actions">
            <!-- Buttons added by the features (js/features/), e.g. the alerts bell -->
            <div id="header-extras" class="header-extras"></div>
            <div class="text-size" role="group" aria-label="Taille du texte">
                <button id="text-smaller" type="button" title="Texte plus petit" aria-label="Texte plus petit">A−</button>
                <button id="text-bigger" type="button" title="Texte plus grand" aria-label="Texte plus grand">A+</button>
            </div>
            <a id="location-chip" class="chip" href="#/reglages" title="Code postal et magasins">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <span id="location-label">Code postal</span>
            </a>
            <a id="settings-btn" class="icon-btn" href="#/reglages" aria-label="Réglages" title="Réglages">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
            </a>
        </div>
    </header>

    <div id="setup-banner" class="setup-banner" hidden>
        <span>Le navigateur PrixMalin est ouvert : faites vos réglages sur le site, puis</span>
        <button id="setup-banner-done" class="btn-primary small" type="button">J'ai terminé</button>
    </div>

    <!-- Links of the views that have a `nav` entry (js/shell/nav.js) -->
    <nav class="primary-nav" aria-label="Navigation principale">
        <div id="primary-nav" class="nav-links"></div>
    </nav>

    <main id="main">
        <!-- Shown by the views that ask for them (`shell` of the view module) -->
        <form id="search-form" class="search" role="search" hidden>
            <input id="q" type="search" placeholder="Farine, huile de tournesol, eau…" autocomplete="off" enterkeyhint="search" aria-label="Produit à rechercher" required>
            <button type="submit" class="btn-primary">Comparer</button>
        </form>
        <div id="store-filters" class="store-filters" aria-label="Enseignes" hidden></div>
        <!-- The view of the route (js/routes.js) -->
        <div id="view"></div>
    </main>

    <div id="toast-region">
        <div id="toast" class="toast" role="status" hidden></div>
    </div>
    <div id="live-region" class="visually-hidden" aria-live="polite"></div>

    <script type="module" src="/static/js/main.js?v=__VERSION__"></script>
</body>
</html>
